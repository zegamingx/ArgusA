name: Argus Android Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "tools/cmake-compat/**"
      - "tools/ci/**"
      - "README.md"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: argus-main-release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Lint, test, sign and publish APK
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Build, verify and publish signed APK on the Windows runner
        env:
          ARGUS_GH_TOKEN: ${{ github.token }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          & .\tools\ci\publish-windows-release.ps1

  build-windows-validation:
    name: Windows self-hosted validation
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify Windows runner identity and pinned Android toolchain
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          Write-Host "Runner identity: $identity"
          if ($identity -ine 'NT AUTHORITY\NETWORK SERVICE') {
            throw "Unexpected runner identity. Expected NT AUTHORITY\NETWORK SERVICE, received $identity"
          }

          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME)) { throw 'JAVA_HOME is missing from the runner service environment.' }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_HOME)) { throw 'ANDROID_HOME is missing from the runner service environment.' }
          if ($env:ANDROID_HOME -ine $env:ANDROID_SDK_ROOT) { throw 'ANDROID_HOME and ANDROID_SDK_ROOT do not point to the same SDK.' }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_NDK_ROOT)) { throw 'ANDROID_NDK_ROOT is missing from the runner service environment.' }
          if ([string]::IsNullOrWhiteSpace($env:CMAKE_HOME)) { throw 'CMAKE_HOME is missing from the runner service environment.' }

          $sdk = $env:ANDROID_SDK_ROOT
          $ndk = Join-Path $sdk 'ndk\30.0.16248370'
          $cmake = Join-Path $env:CMAKE_HOME 'bin\cmake.exe'
          $ninja = 'C:\Tools\Ninja\ninja.exe'
          $java = Join-Path $env:JAVA_HOME 'bin\java.exe'

          $required = @(
            (Join-Path $sdk 'platforms\android-37.0\android.jar'),
            (Join-Path $sdk 'build-tools\37.0.0\apksigner.bat'),
            (Join-Path $ndk 'ndk-build.cmd'),
            (Join-Path $ndk 'shader-tools\windows-x86_64\glslc.exe'),
            $java,
            $cmake,
            $ninja
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required Android build tool is inaccessible: $path" }
          }
          if ([IO.Path]::GetFullPath($env:ANDROID_NDK_ROOT).TrimEnd('\') -ine [IO.Path]::GetFullPath($ndk).TrimEnd('\')) {
            throw "ANDROID_NDK_ROOT is not pinned to $ndk"
          }

          $javaStdout = Join-Path $env:RUNNER_TEMP 'argus-java-version.stdout.txt'
          $javaStderr = Join-Path $env:RUNNER_TEMP 'argus-java-version.stderr.txt'
          $javaProcess = Start-Process -FilePath $java -ArgumentList '-version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $javaStdout -RedirectStandardError $javaStderr
          $javaInfo = ''
          if (Test-Path -LiteralPath $javaStdout) { $javaInfo += Get-Content -LiteralPath $javaStdout -Raw }
          if (Test-Path -LiteralPath $javaStderr) { $javaInfo += Get-Content -LiteralPath $javaStderr -Raw }
          Write-Host $javaInfo
          if ($javaProcess.ExitCode -ne 0 -or $javaInfo -notmatch 'version "25\.') { throw 'The runner must use JDK 25.' }

          $cmakeVersionOutput = @(& $cmake --version)
          $cmakeExitCode = $LASTEXITCODE
          if ($cmakeExitCode -ne 0 -or $cmakeVersionOutput.Count -eq 0) { throw "CMake version check failed with exit code $cmakeExitCode" }
          $cmakeInfo = ([string]$cmakeVersionOutput[0]).Trim()
          Write-Host $cmakeInfo
          if ($cmakeInfo -ne 'cmake version 4.5.0') { throw "Expected CMake 4.5.0, received $cmakeInfo" }

          $ninjaInfo = (& $ninja --version | Out-String).Trim()
          Write-Host "Ninja $ninjaInfo"
          if ($ninjaInfo -ne '1.13.2') { throw "Expected Ninja 1.13.2, received $ninjaInfo" }

          Add-Content -Path $env:GITHUB_ENV -Value 'CMAKE_BUILD_PARALLEL_LEVEL=2'
          Write-Host "Android SDK: $sdk"
          Write-Host "Android NDK: $ndk"
          Write-Host 'Windows runner toolchain verification passed.'

      - name: Install and test CMake 4.5.0 compatibility launcher
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          & .\tools\cmake-compat\install-wrapper.ps1 -RealCMake "$env:CMAKE_HOME\bin\cmake.exe" -WrapperRoot "$env:RUNNER_TEMP\argus-cmake-compat"
      - name: Verify Gradle wrapper
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          & .\gradlew.bat --version
          $gradleExitCode = $LASTEXITCODE
          if ($gradleExitCode -ne 0) { exit $gradleExitCode }

      - name: Run Android lint, unit tests and debug APK build
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          & .\gradlew.bat --no-daemon --no-configuration-cache --max-workers=2 --stacktrace clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
          $gradleExitCode = $LASTEXITCODE
          if ($gradleExitCode -ne 0) { exit $gradleExitCode }
