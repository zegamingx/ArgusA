name: Argus Android Build

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "README.md"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the signed APK to the GitHub Release tag."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: argus-main-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Lint, test, sign and package APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"

          test -s "${sdk_root}/platforms/android-37.0/android.jar"
          test -x "${sdk_root}/platform-tools/adb"

          platform_alias="${sdk_root}/platforms/android-37.0"
          if [[ ! -s "${platform_alias}/android.jar" ]]; then
            if [[ -e "${platform_alias}" && ! -L "${platform_alias}" ]]; then
              echo "::error::Unexpected existing SDK directory: ${platform_alias}"
              exit 1
            fi
            ln -sfn android-37.0 "${platform_alias}"
          fi

          test -s "${platform_alias}/android.jar"
          echo "Android SDK platform ready: minSdk 34, compileSdk 37, targetSdk 37."

      - name: Install Android NDK r30 and CMake 3.31.6
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_path}" ]]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "${sdkmanager_path}"

          set +o pipefail
          yes | "${sdkmanager_path}" --licenses >/dev/null
          set -o pipefail
          "${sdkmanager_path}" --install "build-tools;37.0.0" "ndk;30.0.16248370"
          test -x "${ANDROID_HOME}/build-tools/37.0.0/apksigner"

          cmake_version="3.31.6"
          cmake_archive="cmake-${cmake_version}-linux-x86_64.tar.gz"
          cmake_archive_path="${RUNNER_TEMP}/${cmake_archive}"
          cmake_root="${RUNNER_TEMP}/cmake-${cmake_version}"
          curl --fail --location --retry 3 --silent --show-error \
            "https://cmake.org/files/v3.31/${cmake_archive}" \
            --output "${cmake_archive_path}"
          printf '%s  %s\n' "5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf" "${cmake_archive_path}" | sha256sum --check --status
          mkdir -p "${cmake_root}"
          tar -xzf "${cmake_archive_path}" --strip-components=1 -C "${cmake_root}"
          echo "${cmake_root}/bin" >> "${GITHUB_PATH}"
          "${cmake_root}/bin/cmake" --version | grep -Fx "cmake version ${cmake_version}"

          glslc_path="$(find "${ANDROID_HOME}/ndk/30.0.16248370/shader-tools" -type f -name glslc -print -quit)"
          test -n "${glslc_path}"
          test -x "${glslc_path}"
          echo "NDK r30, CMake ${cmake_version}, and NDK glslc are ready."

      - name: Resolve application version
        shell: bash
        run: |
          set -euo pipefail
          major="$(awk -F= '$1 == "VERSION_MAJOR" { print $2 }' version.properties)"
          minor="$(awk -F= '$1 == "VERSION_MINOR" { print $2 }' version.properties)"
          patch="$(awk -F= '$1 == "VERSION_PATCH" { print $2 }' version.properties)"
          build="$(awk -F= '$1 == "VERSION_BUILD" { print $2 }' version.properties)"

          version_name="${major}.${minor}.${patch}"
          if [[ ! "${build}" =~ ^[0-9]+$ || "${build}" -le 0 ]]; then
            echo "::error::Invalid VERSION_BUILD in version.properties."
            exit 1
          fi

          echo "VERSION_NAME=${version_name}" >> "${GITHUB_ENV}"
          echo "VERSION_BUILD=${build}" >> "${GITHUB_ENV}"
          echo "Building Argus ${version_name} (${build}) from $(git rev-parse HEAD)."

      - name: Restore persistent Argus signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          gh release download argus-signing-key --repo "${GITHUB_REPOSITORY}" --pattern "ARGUS-RELEASE-KEY.p12" --dir signing

          mv "signing/ARGUS-RELEASE-KEY.p12" "signing/argus-release.p12"
          test -s "signing/argus-release.p12"
          keytool -list -storetype PKCS12 -keystore "signing/argus-release.p12" -storepass "" -alias upload >/dev/null

          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/signing/argus-release.p12" >> "${GITHUB_ENV}"
          echo "STORE_PASSWORD=" >> "${GITHUB_ENV}"
          echo "KEY_PASSWORD=" >> "${GITHUB_ENV}"
          echo "Persistent Argus signing identity restored."

      - name: Verify Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Run release lint, unit tests and APK build
        run: |
          chmod +x gradlew
          env -u ANDROID_SDK_ROOT ./gradlew --no-daemon --no-configuration-cache --stacktrace clean :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify APK signature and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "${apk_path}"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "${apk_path}" | grep -Fx "lib/${abi}/libargus_training.so"
          done

          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --verbose --print-certs "${apk_path}" | tee /tmp/apksigner-report.txt

          expected_fingerprint="$(
            keytool -exportcert \
              -storetype PKCS12 \
              -keystore "${KEYSTORE_PATH}" \
              -storepass "" \
              -alias upload |
              sha256sum |
              awk '{print $1}' |
              tr '[:upper:]' '[:lower:]'
          )"
          actual_fingerprint="$(
            awk '
              tolower($0) ~ /certificate sha-256 digest:/ {
                line = $0
                sub(/^.*digest:[[:space:]]*/, "", line)
                gsub(/[^[:xdigit:]]/, "", line)
                print tolower(line)
                exit
              }
            ' /tmp/apksigner-report.txt
          )"

          echo "Expected upload certificate SHA-256: ${expected_fingerprint}"
          echo "Actual APK signer SHA-256: ${actual_fingerprint}"

          if [[ ! "${expected_fingerprint}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not extract the persistent upload certificate fingerprint."
            exit 1
          fi

          if [[ ! "${actual_fingerprint}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not extract the APK signer certificate fingerprint."
            exit 1
          fi

          if [[ "${expected_fingerprint}" != "${actual_fingerprint}" ]]; then
            echo "::error::APK certificate does not match the persistent Argus signing identity."
            exit 1
          fi

          mkdir -p dist
          cp "${apk_path}" "dist/ARGUS-v${VERSION_NAME}.apk"
          cp "${apk_path}" "dist/ARGUS.apk"
          (cd dist && sha256sum "ARGUS-v${VERSION_NAME}.apk" > "ARGUS-v${VERSION_NAME}.apk.sha256")
          (cd dist && sha256sum "ARGUS.apk" > "ARGUS.apk.sha256")
          echo "APK signature verified against the persistent Argus upload certificate."

      - name: Remove signing key from workspace
        shell: bash
        run: |
          set -euo pipefail
          # The keystore was downloaded only to sign this APK; do not leave it
          # in the workspace for later steps.
          if [[ -n "${KEYSTORE_PATH:-}" ]]; then
            rm -f -- "${KEYSTORE_PATH}"
          fi
          rmdir signing 2>/dev/null || true

      # Release publication is an explicit workflow-dispatch action; ordinary main pushes only validate and build.
      - name: Publish latest signed APK to GitHub Release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          release_apk="ARGUS-v${VERSION_NAME}.apk"
          cp "${apk_path}" "${release_apk}"
          cp "${apk_path}" "ARGUS.apk"

          # Upload directly to the 'Release' tag release page
          if gh release view "Release" >/dev/null 2>&1; then
            echo "Updating existing Release tag with latest APK..."
            gh release upload "Release" "${release_apk}" "ARGUS.apk" --clobber
          else
            echo "Creating Release tag and publishing latest APK..."
            gh release create "Release" "${release_apk}" "ARGUS.apk" \
              --title "Argus Latest Release" \
              --notes "Latest signed release APK for Argus (v${VERSION_NAME}). Automatically published from main build."
          fi

          # Keep exactly one versioned APK plus the stable ARGUS.apk alias.
          # The signing-key backup is stored in a separate release and is untouched.
          stale_assets="$(gh release view "Release" --json assets --jq '.assets[].name' |
            grep -E '^ARGUS-v[0-9]+\.[0-9]+\.[0-9]+\.apk$' || true)"
          while IFS= read -r stale_asset; do
            [[ -z "${stale_asset}" || "${stale_asset}" == "${release_apk}" ]] && continue
            echo "Removing superseded release asset: ${stale_asset}"
            gh release delete-asset "Release" "${stale_asset}" --yes
          done <<< "${stale_assets}"

          echo "Successfully published APK to https://github.com/${{ github.repository }}/releases/tag/Release"
