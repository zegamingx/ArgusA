name: Argus Android Build

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "tools/cmake-compat/**"
      - "tools/ci/**"
      - "README.md"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: argus-main-release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Lint, test, sign and publish APK
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Build, verify and publish signed APK on the Windows runner
        env:
          ARGUS_GH_TOKEN: ${{ github.token }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          & .\tools\ci\publish-windows-release.ps1
