name: Argus Android Release

on:
  # One-time migration build for v1.0.6. Future builds use published releases.
  push:
    branches:
      - "build/v1.0.6"
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: argus-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'v') &&
       github.event.release.tag_name != 'v1.0.6')
    name: Lint, test, sign and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned Android CLI
        shell: bash
        run: |
          set -euo pipefail
          download_path="${RUNNER_TEMP}/android-cli"
          curl --fail --silent --show-error --location \
            "https://dl.google.com/android/cli/latest/linux_x86_64/android" \
            --output "${download_path}"
          chmod 0755 "${download_path}"
          sudo install -m 0755 "${download_path}" /usr/local/bin/android
          set +o pipefail
          yes | /usr/local/bin/android --no-metrics --version
          cli_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "${cli_status}" -ne 0 ]]; then
            exit "${cli_status}"
          fi

          version="$(/usr/local/bin/android --no-metrics --version | tail -n 1)"
          test "${version}" = "1.0.16625370"
          echo "Android CLI ${version} is ready."

      - name: Install Android SDK Platform and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${sdk_root}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"

          set +o pipefail
          yes | /usr/local/bin/android --no-metrics --sdk="${sdk_root}" sdk install platforms/android-37 --canary
          install_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "${install_status}" -ne 0 ]]; then
            exit "${install_status}"
          fi

          set +o pipefail
          yes | /usr/local/bin/android --no-metrics --sdk="${sdk_root}" sdk install build-tools/36.0.0 platform-tools
          install_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "${install_status}" -ne 0 ]]; then
            exit "${install_status}"
          fi

          test -x "${sdk_root}/build-tools/36.0.0/apksigner"
          test -x "${sdk_root}/platform-tools/adb"

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME#build/}"
          else
            release_tag="${{ github.event.release.tag_name }}"
          fi

          major="$(awk -F= '$1 == "VERSION_MAJOR" { print $2 }' version.properties)"
          minor="$(awk -F= '$1 == "VERSION_MINOR" { print $2 }' version.properties)"
          patch="$(awk -F= '$1 == "VERSION_PATCH" { print $2 }' version.properties)"
          expected_tag="v${major}.${minor}.${patch}"

          if [[ "${release_tag}" != "${expected_tag}" ]]; then
            echo "::error::Release tag ${release_tag} does not match version.properties (${expected_tag})."
            exit 1
          fi

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "Building ${release_tag} from $(git rev-parse HEAD)"

      - name: Restore or create standalone Argus signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing

          if gh release view argus-signing-key >/dev/null 2>&1; then
            gh release download argus-signing-key \
              --pattern "ARGUS-RELEASE-KEY.p12" \
              --dir signing
            mv "signing/ARGUS-RELEASE-KEY.p12" "signing/argus-release.p12"
            echo "Restored the persistent Argus signing identity."
          else
            openssl req -x509 -newkey rsa:3072 -sha256 -nodes \
              -keyout signing/argus-release-private.pem \
              -out signing/argus-release-certificate.pem \
              -subj "/CN=Argus Standalone Release/O=Argus/" \
              -days 10000

            openssl pkcs12 -export \
              -inkey signing/argus-release-private.pem \
              -in signing/argus-release-certificate.pem \
              -name upload \
              -out signing/argus-release.p12 \
              -passout pass:

            keytool -list -storetype PKCS12 \
              -keystore signing/argus-release.p12 \
              -storepass "" -alias upload >/dev/null

            cp signing/argus-release.p12 ARGUS-RELEASE-KEY.p12
            gh release create argus-signing-key "ARGUS-RELEASE-KEY.p12" \
              --target "${SOURCE_SHA}" \
              --title "Argus Signing Key Backup" \
              --notes "Private signing-key backup for the Argus standalone release workflow. This asset is unencrypted; access to this private repository grants access to the signing identity. Never distribute it."

            rm -f ARGUS-RELEASE-KEY.p12 \
              signing/argus-release-private.pem \
              signing/argus-release-certificate.pem
            echo "Created and stored the persistent Argus signing identity."
          fi

          keytool -list -storetype PKCS12 \
            -keystore signing/argus-release.p12 \
            -storepass "" -alias upload >/dev/null

          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/signing/argus-release.p12" >> "${GITHUB_ENV}"
          echo "STORE_PASSWORD=" >> "${GITHUB_ENV}"
          echo "KEY_PASSWORD=" >> "${GITHUB_ENV}"

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Run lint, unit tests and release build
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:lintRelease \
            :app:testDebugUnitTest \
            :app:assembleRelease

      - name: Verify APK signature matches Argus signing identity
        shell: bash
        run: |
          set -euo pipefail

          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "${apk_path}"

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "${apk_path}" > /tmp/apksigner-report.txt

          expected_fingerprint="$(
            keytool -list -v -storetype PKCS12 \
              -keystore "${KEYSTORE_PATH}" -storepass "" -alias upload 2>/dev/null |
              awk -F': ' '/SHA256:/{print $2; exit}' |
              tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'
          )"
          actual_fingerprint="$(
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              /tmp/apksigner-report.txt |
              tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'
          )"

          if [[ -z "${expected_fingerprint}" || "${expected_fingerprint}" != "${actual_fingerprint}" ]]; then
            echo "::error::APK certificate does not match the persistent Argus signing identity."
            exit 1
          fi

          echo "APK signature verified against the persistent Argus upload certificate."

      - name: Publish signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          apk_path="app/build/outputs/apk/release/app-release.apk"
          release_apk="ARGUS-${RELEASE_TAG}.apk"
          cp "${apk_path}" "${release_apk}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${release_apk}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${release_apk}" \
              --target "${SOURCE_SHA}" \
              --title "Argus ${RELEASE_TAG}" \
              --generate-notes
          fi

          echo "Published ${release_apk} to ${RELEASE_TAG}."

          # Remove the previous misnamed debug-preview release after the real
          # versioned release has been published successfully.
          if gh release view "Release" >/dev/null 2>&1; then
            gh release delete "Release" --yes --cleanup-tag
          fi
