name: Tagged Android Release

on:
  push:
    tags:
      - "v*"
  release:
    # Support releases created or corrected through the GitHub UI.
    types:
      - published
      - edited
  create:

permissions:
  contents: write

concurrency:
  group: argus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    # A temporary build/* branch lets us start the release through the GitHub
    # connector even when a tag/ref creation operation is not available.
    # Ordinary branch creation events are ignored.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'create' &&
       github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'build/v'))
    name: Lint, test, build and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK Platform and Build Tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/tags/*)
              release_tag="${GITHUB_REF_NAME}"
              ;;
            refs/heads/build/*)
              release_tag="${GITHUB_REF_NAME#build/}"
              ;;
            *)
              echo "::error::Unsupported release ref: ${GITHUB_REF}"
              exit 1
              ;;
          esac

          major="$(awk -F= '$1 == "VERSION_MAJOR" { print $2 }' version.properties)"
          minor="$(awk -F= '$1 == "VERSION_MINOR" { print $2 }' version.properties)"
          patch="$(awk -F= '$1 == "VERSION_PATCH" { print $2 }' version.properties)"
          expected_tag="v${major}.${minor}.${patch}"

          if [[ "${release_tag}" != "${expected_tag}" ]]; then
            echo "::error::Release tag ${release_tag} does not match version.properties (${expected_tag})."
            exit 1
          fi

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "Building release ${release_tag} from ${GITHUB_SHA}"

      - name: Prepare release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${STORE_PASSWORD_SECRET}" || -z "${KEY_PASSWORD_SECRET}" ]]; then
            echo "::error::Configure KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD in GitHub Actions secrets before publishing a signed release."
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/my-upload-key.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"

          # Use the project's release key only. The AI Studio debug key is
          # intentionally excluded from release signing.
          keytool -list -keystore "${keystore_path}" \
            -storepass "${STORE_PASSWORD_SECRET}" -alias upload >/dev/null

          {
            echo "KEYSTORE_PATH=${keystore_path}"
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET}"
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET}"
          } >> "${GITHUB_ENV}"

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Run lint, unit tests and release build
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:lintRelease \
            :app:testReleaseUnitTest \
            :app:assembleRelease

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "${apk_path}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${apk_path}"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "${apk_path}"

          release_apk="ARGUS-${RELEASE_TAG}.apk"
          cp "${apk_path}" "${release_apk}"

          # A release can be pre-created in the GitHub UI. Upload to it when
          # present; otherwise create the semver tag and release at this SHA.
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${release_apk}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${release_apk}" \
              --target "${GITHUB_SHA}" \
              --title "Argus ${RELEASE_TAG}" \
              --generate-notes
          fi
