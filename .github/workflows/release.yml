name: Tagged Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: argus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Lint, test, build and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK Platform and Build Tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Verify tag matches application version
        shell: bash
        run: |
          set -euo pipefail
          major="$(awk -F= '$1 == "VERSION_MAJOR" { print $2 }' version.properties)"
          minor="$(awk -F= '$1 == "VERSION_MINOR" { print $2 }' version.properties)"
          patch="$(awk -F= '$1 == "VERSION_PATCH" { print $2 }' version.properties)"
          expected_tag="v${major}.${minor}.${patch}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version.properties (${expected_tag})."
            exit 1
          fi

      - name: Prepare release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${STORE_PASSWORD_SECRET}" || -z "${KEY_PASSWORD_SECRET}" ]]; then
            echo "::error::Configure KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD in GitHub Actions secrets before publishing a signed release."
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/argus-upload-key.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"

          {
            echo "KEYSTORE_PATH=${keystore_path}"
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET}"
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET}"
          } >> "${GITHUB_ENV}"

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Run lint, unit tests and release build
        run: >
          ./gradlew
          --no-daemon
          --stacktrace
          clean
          :app:lintRelease
          :app:testReleaseUnitTest
          :app:assembleRelease

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "${apk_path}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${apk_path}"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "${apk_path}"

          release_apk="ARGUS-${GITHUB_REF_NAME}.apk"
          cp "${apk_path}" "${release_apk}"

          gh release create "${GITHUB_REF_NAME}" "${release_apk}" \
            --verify-tag \
            --title "Argus ${GITHUB_REF_NAME}" \
            --generate-notes
