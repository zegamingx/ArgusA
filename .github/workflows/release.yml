name: Tagged Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: argus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Lint, test, sign and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK Platform and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          # Android API 37 is distributed through the preview/canary SDK channel.
          android sdk install platforms/android-37 --canary
          android sdk install build-tools/36.0.0

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          major="$(awk -F= '$1 == "VERSION_MAJOR" { print $2 }' version.properties)"
          minor="$(awk -F= '$1 == "VERSION_MINOR" { print $2 }' version.properties)"
          patch="$(awk -F= '$1 == "VERSION_PATCH" { print $2 }' version.properties)"
          expected_tag="v${major}.${minor}.${patch}"

          if [[ "${release_tag}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${release_tag} does not match version.properties (${expected_tag})."
            exit 1
          fi

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "Building ${release_tag} from ${GITHUB_SHA}"

      - name: Validate existing release keystore
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keystore_path="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [[ ! -s "${keystore_path}" ]]; then
            echo "::error::The existing my-upload-key.jks was not found in the tagged source."
            exit 1
          fi

          if [[ -z "${STORE_PASSWORD}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::error::Configure STORE_PASSWORD and KEY_PASSWORD in GitHub Actions secrets. The workflow will not fall back to a debug key."
            exit 1
          fi

          # The supplied .jks file is PKCS#12 encoded and uses the existing upload alias.
          keytool -list -storetype PKCS12 -keystore "${keystore_path}" \
            -storepass "${STORE_PASSWORD}" -alias upload >/dev/null

      - name: Run lint, unit tests and release build
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            :app:lintRelease \
            :app:testReleaseUnitTest \
            :app:assembleRelease

      - name: Verify APK signature matches upload keystore
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail

          apk_path="app/build/outputs/apk/release/app-release.apk"
          keystore_path="${GITHUB_WORKSPACE}/my-upload-key.jks"
          test -s "${apk_path}"

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "${apk_path}" >/tmp/apksigner-report.txt

          expected_fingerprint="$(
            keytool -list -v -storetype PKCS12 -keystore "${keystore_path}" \
              -storepass "${STORE_PASSWORD}" -alias upload 2>/dev/null |
              awk -F': ' '/SHA256:/{print $2; exit}' |
              tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'
          )"
          actual_fingerprint="$(
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              /tmp/apksigner-report.txt |
              tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'
          )"

          if [[ -z "${expected_fingerprint}" || "${expected_fingerprint}" != "${actual_fingerprint}" ]]; then
            echo "::error::APK signer does not match the existing upload certificate."
            exit 1
          fi

          echo "APK signature verified against alias 'upload'."

      - name: Publish signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          apk_path="app/build/outputs/apk/release/app-release.apk"
          release_apk="ARGUS-${RELEASE_TAG}.apk"
          cp "${apk_path}" "${release_apk}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${release_apk}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${release_apk}" \
              --target "${GITHUB_SHA}" \
              --title "Argus ${RELEASE_TAG}" \
              --generate-notes
          fi
