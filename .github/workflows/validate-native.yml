name: Argus Native Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "tools/cmake-compat/**"
      - "tools/native-tests/**"
      - "tools/ci/**"
      - ".github/workflows/validate-native.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: argus-native-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile Vulkan NDK, lint, test and package debug APK
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          test -s "${sdk_root}/platforms/android-37.0/android.jar"
          sdk_platform="${sdk_root}/platforms/android-37.0"
          if [[ ! -s "${sdk_platform}/android.jar" ]]; then
            echo "::error::Android SDK platform android-37.0 is not installed."
            exit 1
          fi

      - name: Install Android NDK r30 and CMake 4.5.0
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_path}" ]]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "${sdkmanager_path}"

          set +o pipefail
          yes | "${sdkmanager_path}" --licenses >/dev/null
          set -o pipefail
          "${sdkmanager_path}" --install "build-tools;37.0.0" "ndk;30.0.16248370"
          test -x "${ANDROID_HOME}/build-tools/37.0.0/apksigner"

          cmake_version="4.5.0"
          cmake_archive="cmake-${cmake_version}-linux-x86_64.tar.gz"
          cmake_archive_path="${RUNNER_TEMP}/${cmake_archive}"
          cmake_root="${RUNNER_TEMP}/cmake-${cmake_version}"
          # Fetch the official Kitware release asset; the pinned SHA-256 below remains mandatory.
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/${cmake_archive}" \
            --output "${cmake_archive_path}"
          printf '%s  %s\n' "81f0d5b0960fb6adc8197030ffc827fba937640d51e73e39e0e9e40d88c66f6f" "${cmake_archive_path}" | sha256sum --check --status
          mkdir -p "${cmake_root}"
          tar -xzf "${cmake_archive_path}" --strip-components=1 -C "${cmake_root}"
          tools/cmake-compat/install-wrapper.sh "${cmake_root}/bin/cmake" "${RUNNER_TEMP}/argus-cmake-compat"
          "${RUNNER_TEMP}/argus-cmake-compat/bin/cmake" --version | grep -Fx "cmake version ${cmake_version}"

          glslc_path="$(find "${ANDROID_HOME}/ndk/30.0.16248370/shader-tools" -type f -name glslc -print -quit)"
          test -n "${glslc_path}"
          test -x "${glslc_path}"
          echo "NDK r30, CMake ${cmake_version}, and NDK glslc are ready."
# Host-side regression coverage for allocator handles and bounded Vulkan buffer transfers.
      - name: Run Tensor Arena host unit tests
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -O2 \
            tools/native-tests/tensor_arena_core_test.cpp \
            -o "${RUNNER_TEMP}/argus-tensor-arena-core-test"
          "${RUNNER_TEMP}/argus-tensor-arena-core-test"

      - name: Verify Gradle and Java toolchain
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Run native build, lint and unit tests
        run: |
          chmod +x gradlew
          env -u ANDROID_SDK_ROOT ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --warning-mode=all \
            --stacktrace \
            clean \
            :app:lintRelease \
            :app:testReleaseUnitTest \
            :app:assembleDebug

      - name: Verify packaged native ABI libraries
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${apk_path}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "${apk_path}" | grep -Fx "lib/${abi}/libargus_training.so"
          done
