name: Argus Native Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/validate-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-native-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile Vulkan NDK, lint, test and package debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          test -s "${sdk_root}/platforms/android-37.0/android.jar"
          test -x "${sdk_root}/build-tools/36.0.0/apksigner"
          platform_alias="${sdk_root}/platforms/android-37"
          if [[ ! -s "${platform_alias}/android.jar" ]]; then
            if [[ -e "${platform_alias}" && ! -L "${platform_alias}" ]]; then
              echo "::error::Unexpected existing SDK directory: ${platform_alias}"
              exit 1
            fi
            ln -sfn android-37.0 "${platform_alias}"
          fi
          test -s "${platform_alias}/android.jar"

      - name: Install pinned Vulkan NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_path}" ]]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "${sdkmanager_path}"
          set +o pipefail
          yes | "${sdkmanager_path}" --licenses >/dev/null
          set -o pipefail
          "${sdkmanager_path}" --install "ndk;30.0.16248370" "cmake;3.22.1"
          glslc_path="$(find "${ANDROID_HOME}/ndk/30.0.16248370/shader-tools" -type f -name glslc -print -quit)"
          test -n "${glslc_path}"
          test -x "${glslc_path}"
          test -d "${ANDROID_HOME}/cmake/3.22.1"

      - name: Verify Gradle and Java toolchain
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Run native build, lint and unit tests
        run: |
          chmod +x gradlew
          env -u ANDROID_SDK_ROOT ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --warning-mode=all \
            --stacktrace \
            clean \
            :app:lintRelease \
            :app:testReleaseUnitTest \
            :app:assembleDebug

      - name: Verify packaged native ABI libraries
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${apk_path}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "${apk_path}" | grep -Fx "lib/${abi}/libargus_training.so"
          done
