name: Argus Native Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "tools/cmake-compat/**"
      - "tools/native-tests/**"
      - "tools/ci/**"
      - ".github/workflows/validate-native.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: argus-native-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile Vulkan NDK, lint, test and package debug APK
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify Windows runner and pinned Android toolchain
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          Write-Host "Runner identity: $identity"
          if ($identity -ine 'NT AUTHORITY\NETWORK SERVICE') {
            throw "Unexpected runner identity: $identity"
          }

          foreach ($name in @('JAVA_HOME', 'ANDROID_HOME', 'ANDROID_SDK_ROOT', 'ANDROID_NDK_ROOT', 'CMAKE_HOME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required machine environment variable is missing: $name"
            }
          }
          if ($env:ANDROID_HOME -ine $env:ANDROID_SDK_ROOT) {
            throw 'ANDROID_HOME and ANDROID_SDK_ROOT must resolve to the same Android SDK.'
          }

          $sdk = $env:ANDROID_SDK_ROOT
          $ndk = Join-Path $sdk 'ndk\30.0.16248370'
          $java = Join-Path $env:JAVA_HOME 'bin\java.exe'
          $cmake = Join-Path $env:CMAKE_HOME 'bin\cmake.exe'
          $ninja = 'C:\Tools\Ninja\ninja.exe'

          $required = @(
            (Join-Path $sdk 'platforms\android-37.0\android.jar'),
            (Join-Path $sdk 'build-tools\37.0.0\apksigner.bat'),
            (Join-Path $ndk 'ndk-build.cmd'),
            (Join-Path $ndk 'shader-tools\windows-x86_64\glslc.exe'),
            $java,
            $cmake,
            $ninja
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required build tool is unavailable to the runner: $path"
            }
          }
          if ([IO.Path]::GetFullPath($env:ANDROID_NDK_ROOT).TrimEnd('\') -ine [IO.Path]::GetFullPath($ndk).TrimEnd('\')) {
            throw "ANDROID_NDK_ROOT must point to the pinned NDK: $ndk"
          }

          $javaOut = Join-Path $env:RUNNER_TEMP 'argus-native-java.stdout.txt'
          $javaErr = Join-Path $env:RUNNER_TEMP 'argus-native-java.stderr.txt'
          $javaProcess = Start-Process -FilePath $java -ArgumentList '-version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $javaOut -RedirectStandardError $javaErr
          $javaInfo = ''
          if (Test-Path -LiteralPath $javaOut) { $javaInfo += Get-Content -LiteralPath $javaOut -Raw }
          if (Test-Path -LiteralPath $javaErr) { $javaInfo += Get-Content -LiteralPath $javaErr -Raw }
          Write-Host $javaInfo
          if ($javaProcess.ExitCode -ne 0 -or $javaInfo -notmatch 'version "25\.') {
            throw 'The Windows runner must use JDK 25.'
          }

          $cmakeVersionOutput = @(& $cmake --version)
          $cmakeExitCode = $LASTEXITCODE
          if ($cmakeExitCode -ne 0 -or $cmakeVersionOutput.Count -eq 0) { throw "CMake version check failed with exit code $cmakeExitCode" }
          $cmakeInfo = ([string]$cmakeVersionOutput[0]).Trim()
          if ($cmakeInfo -ne 'cmake version 4.5.0') { throw "Expected CMake 4.5.0, received: $cmakeInfo" }
          $ninjaInfo = (& $ninja --version | Out-String).Trim()
          if ($ninjaInfo -ne '1.13.2') { throw "Expected Ninja 1.13.2, received: $ninjaInfo" }

          Add-Content -Path $env:GITHUB_ENV -Value 'CMAKE_BUILD_PARALLEL_LEVEL=2'
          Write-Host "Android SDK: $sdk"
          Write-Host "Android NDK: $ndk"
          Write-Host "CMake: $cmakeInfo"
          Write-Host "Ninja: $ninjaInfo"
          Write-Host 'Windows Android toolchain verification passed.'

      - name: Install and test CMake 4.5.0 compatibility launcher
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          & .\tools\cmake-compat\install-wrapper.ps1 -RealCMake "$env:CMAKE_HOME\bin\cmake.exe" -WrapperRoot "$env:RUNNER_TEMP\argus-cmake-compat"

      - name: Run Tensor Arena host unit tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vswhereCandidates = @()
          if (-not [string]::IsNullOrWhiteSpace($programFilesX86)) {
            $vswhereCandidates += (Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe')
          }
          $vswhereCandidates += (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe')
          $vswhere = $vswhereCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vswhere)) {
            throw 'Tensor Arena host tests require Visual Studio Build Tools with the MSVC x64 C++ workload. Install Desktop development with C++ and the Windows 10/11 SDK.'
          }

          $vsInstall = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw 'MSVC x64 C++ build tools were not found. Install the Visual C++ build tools workload.'
          }

          $vcvars = Join-Path $vsInstall 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) {
            throw "MSVC environment initializer is missing: $vcvars"
          }

          $source = Join-Path $env:GITHUB_WORKSPACE 'tools\native-tests\tensor_arena_core_test.cpp'
          $testExe = Join-Path $env:RUNNER_TEMP 'argus-tensor-arena-core-test.exe'
          $batch = Join-Path $env:RUNNER_TEMP 'argus-build-tensor-arena-test.cmd'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Tensor Arena host test source is missing: $source"
          }

          $batchContent = @"
          @echo off
          call "$vcvars" >nul
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /std:c++23 /EHsc /W4 /WX /O2 "$source" /Fe:"$testExe"
          if errorlevel 1 exit /b %errorlevel%
          "$testExe"
          exit /b %errorlevel%
          "@
          [IO.File]::WriteAllText($batch, $batchContent, [Text.Encoding]::ASCII)

          $batchArgument = '"' + $batch + '"'
          & $env:ComSpec /d /c $batchArgument
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { throw "Tensor Arena C++23 host tests failed with exit code $testExitCode." }
          Write-Host 'Tensor Arena C++23 host unit tests passed.'

      - name: Verify Gradle and Java toolchain
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          & .\gradlew.bat --version
          $gradleExitCode = $LASTEXITCODE
          if ($gradleExitCode -ne 0) { exit $gradleExitCode }

      - name: Prepare lint-safe Android SDK metadata
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_HOME) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) {
            throw 'ANDROID_HOME and ANDROID_SDK_ROOT must be available to Gradle.'
          }

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $sdkRoot = [IO.Path]::GetFullPath($env:ANDROID_SDK_ROOT)
          $workspaceDrive = [IO.Path]::GetPathRoot($workspace)
          $sdkDrive = [IO.Path]::GetPathRoot($sdkRoot)
          if ($workspaceDrive -ine $sdkDrive) {
            throw "The runner workspace and Android SDK must be on the same drive for a portable local.properties path. Workspace: $workspace; SDK: $sdkRoot"
          }

          $workspaceUri = [Uri]::new($workspace.TrimEnd([char]92) + [string][char]92)
          $sdkUri = [Uri]::new($sdkRoot.TrimEnd([char]92) + [string][char]92)
          $relativeSdk = [Uri]::UnescapeDataString($workspaceUri.MakeRelativeUri($sdkUri).ToString())
          if ([string]::IsNullOrWhiteSpace($relativeSdk) -or
              $relativeSdk.Contains(':') -or
              $relativeSdk.Contains([string][char]92)) {
            throw "The generated SDK path is not a safe relative Java-properties value: $relativeSdk"
          }

          $relativeSdkWindows = $relativeSdk.Replace('/', '\')
          $resolvedSdk = [IO.Path]::GetFullPath((Join-Path $workspace $relativeSdkWindows))
          if ($resolvedSdk.TrimEnd([char]92) -ine $sdkRoot.TrimEnd([char]92)) {
            throw "Relative SDK path did not round-trip. Expected $sdkRoot, resolved $resolvedSdk"
          }

          $localProperties = Join-Path $workspace 'local.properties'
          $propertyLine = "sdk.dir=$relativeSdk"
          [IO.File]::WriteAllText(
            $localProperties,
            $propertyLine + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )
          $storedLine = (Get-Content -LiteralPath $localProperties -Raw).TrimEnd([char[]]@([char]10, [char]13))
          if ($storedLine -cne $propertyLine) {
            throw "local.properties verification failed. Expected '$propertyLine', received '$storedLine'."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $resolvedSdk 'platforms\android-37.0\android.jar') -PathType Leaf)) {
            throw "The relative Android SDK path does not contain platform android-37.0: $resolvedSdk"
          }

          Write-Host "Workspace: $workspace"
          Write-Host "Android SDK: $sdkRoot"
          Write-Host "Lint-safe sdk.dir: $relativeSdk"
          Write-Host 'Android SDK metadata round-trip verification passed.'

      - name: Run native build, lint and unit tests
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          $gradleLog = Join-Path $env:RUNNER_TEMP 'argus-gradle-validation.log'
          $gradleArguments = @(
            '--no-daemon',
            '--no-configuration-cache',
            '--max-workers=2',
            '--warning-mode=all',
            '--stacktrace',
            'clean',
            ':app:lintRelease',
            ':app:testReleaseUnitTest',
            ':app:assembleDebug'
          )
          & .\gradlew.bat @gradleArguments 2>&1 | Tee-Object -FilePath $gradleLog
          $gradleExitCode = $LASTEXITCODE
          if ($gradleExitCode -ne 0) {
            $diagnosticPattern = '(^e: |error:|FAILURE:|What went wrong|BUILD FAILED|Lint found|Exception|Execution failed for task|Could not )'
            $diagnostics = @(
              Get-Content -LiteralPath $gradleLog |
                Select-String -Pattern $diagnosticPattern |
                Select-Object -Last 100 |
                ForEach-Object { $_.Line }
            )
            if ($diagnostics.Count -eq 0) {
              $diagnostics = @(Get-Content -LiteralPath $gradleLog | Select-Object -Last 100)
            }

            $summary = @(
              '## Gradle validation failed',
              '',
              "Exit code: $gradleExitCode",
              '',
              'Gradle failure diagnostics:'
            ) + $diagnostics
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join [Environment]::NewLine)

            Write-Host '::group::Gradle failure diagnostics'
            foreach ($line in $diagnostics) { Write-Host $line }
            Write-Host '::endgroup::'
            exit $gradleExitCode
          }

      - name: Verify packaged native ABI libraries
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Join-Path $env:GITHUB_WORKSPACE 'app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path -LiteralPath $apk -PathType Leaf) -or (Get-Item -LiteralPath $apk).Length -le 0) {
            throw "Debug APK was not produced: $apk"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($apk)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($abi in @('arm64-v8a', 'armeabi-v7a', 'x86_64')) {
              $requiredEntry = "lib/$abi/libargus_training.so"
              if ($entries -notcontains $requiredEntry) {
                throw "Debug APK is missing native ABI library: $requiredEntry"
              }
              Write-Host "Verified $requiredEntry"
            }
          }
          finally {
            $archive.Dispose()
          }
          Write-Host 'Packaged native ABI verification passed.'
