name: Argus Installable Release

on:
  push:
    branches:
      - main
    tags:
      - Release
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "tools/cmake-compat/**"
      - "tools/native-tests/**"
      - "tools/ci/**"
      - "tools/security/sign-release.sh"
      - ".github/workflows/argus-native-validation.yml"
      - ".github/workflows/argus-installable-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-installable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/tags/Release' }}
    name: Build, sign and verify installable APK
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment:
      name: argus-release

    steps:

      - name: Checkout trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Release tag targets the current main commit
        if: ${{ github.ref == 'refs/tags/Release' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$release_commit" != "$main_commit" ]]; then
            echo "::error::The Release tag points to $release_commit, but main is $main_commit."
            echo "::error::Move the Release tag only after the reviewed changes are merged to main, then push the updated tag."
            exit 1
          fi
          echo "Release tag and main both point to $main_commit."

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          test -s "${sdk_root}/platforms/android-37.0/android.jar"

      - name: Install Android NDK r30 and CMake 4.5.0
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_path}" ]]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "${sdkmanager_path}"

          set +o pipefail
          yes | "${sdkmanager_path}" --licenses >/dev/null
          set -o pipefail
          "${sdkmanager_path}" --install "build-tools;37.0.0" "ndk;30.0.16248370"
          test -x "${ANDROID_HOME}/build-tools/37.0.0/zipalign"
          test -x "${ANDROID_HOME}/build-tools/37.0.0/apksigner"
          test -x "${ANDROID_HOME}/build-tools/37.0.0/aapt"

          cmake_version="4.5.0"
          cmake_archive="cmake-${cmake_version}-linux-x86_64.tar.gz"
          cmake_archive_path="${RUNNER_TEMP}/${cmake_archive}"
          cmake_root="${RUNNER_TEMP}/cmake-${cmake_version}"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/${cmake_archive}" \
            --output "${cmake_archive_path}"
          printf '%s  %s\n' "81f0d5b0960fb6adc8197030ffc827fba937640d51e73e39e0e9e40d88c66f6f" "${cmake_archive_path}" | sha256sum --check --status
          mkdir -p "${cmake_root}"
          tar -xzf "${cmake_archive_path}" --strip-components=1 -C "${cmake_root}"
          tools/cmake-compat/install-wrapper.sh "${cmake_root}/bin/cmake" "${RUNNER_TEMP}/argus-cmake-compat"
          "${RUNNER_TEMP}/argus-cmake-compat/bin/cmake" --version | grep -Fx "cmake version ${cmake_version}"

          glslc_path="$(find "${ANDROID_HOME}/ndk/30.0.16248370/shader-tools" -type f -name glslc -print -quit)"
          test -n "${glslc_path}"
          test -x "${glslc_path}"
          echo "NDK r30, CMake ${cmake_version}, and NDK glslc are ready."

      - name: Run Tensor Arena host unit tests
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -O2 \
            tools/native-tests/tensor_arena_core_test.cpp \
            -o "${RUNNER_TEMP}/argus-tensor-arena-core-test"
          "${RUNNER_TEMP}/argus-tensor-arena-core-test"

      - name: Run release lint, unit tests and native APK build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          env -u ANDROID_SDK_ROOT ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --warning-mode=all \
            --stacktrace \
            clean \
            :app:lintRelease \
            :app:testReleaseUnitTest \
            :app:assembleRelease

          apk_path="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "${apk_path}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "${apk_path}" | grep -Fx "lib/${abi}/libargus_training.so"
          done

      - name: Create and verify installable CI APK
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signing_dir="$RUNNER_TEMP/argus-ephemeral-signing"
          dist_dir="dist"
          aligned_apk="$signing_dir/ARGUS-aligned.apk"
          signed_apk="$dist_dir/ARGUS-CI.apk"
          keystore="$signing_dir/argus-ci-ephemeral.p12"
          verify_log="$signing_dir/apksigner-verify.txt"

          test -s "$unsigned_apk"
          mkdir -p "$signing_dir" "$dist_dir"
          trap 'rm -rf "$signing_dir"; unset ARGUS_CI_KEY_PASSWORD' EXIT

          export ARGUS_CI_KEY_PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair \
            -noprompt \
            -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass "$ARGUS_CI_KEY_PASSWORD" \
            -keypass "$ARGUS_CI_KEY_PASSWORD" \
            -alias argus-ci-ephemeral \
            -dname "CN=Argus Ephemeral CI Build,O=Argus,C=ID" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650

          "$build_tools/zipalign" -f -P 16 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/zipalign" -c -P 16 4 "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias argus-ci-ephemeral \
            --ks-pass env:ARGUS_CI_KEY_PASSWORD \
            --key-pass env:ARGUS_CI_KEY_PASSWORD \
            --min-sdk-version 34 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$signed_apk" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose --print-certs "$signed_apk" > "$verify_log" 2>&1
          cat "$verify_log"
          fingerprint="$(awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' "$verify_log" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "${#fingerprint}" -eq 64

          package_line="$("$build_tools/aapt" dump badging "$signed_apk" | grep -m1 '^package:')"
          case "$package_line" in
            *"name='com.argus.agi'"*) ;;
            *) echo "::error::Unexpected APK package metadata: $package_line"; exit 1 ;;
          esac
          "$build_tools/zipalign" -c -P 16 4 "$signed_apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$signed_apk" | grep -Fx "lib/$abi/libargus_training.so"
          done

          sha256sum "$signed_apk" > "$signed_apk.sha256"
          printf '%s\n' "$fingerprint" > "$signed_apk.certificate-sha256"
          {
            echo "Application: com.argus.agi"
            echo "Source commit: $GITHUB_SHA"
            echo "Source branch: $GITHUB_REF_NAME"
            echo "Package metadata: $package_line"
            echo "APK SHA-256: $(awk '{print $1}' "$signed_apk.sha256")"
            echo "Signing certificate SHA-256: $fingerprint"
            echo "Signature: apksigner verified; v3 scheme valid for minSdk 34"
            echo "ZIP alignment: verified for 16 KiB native-library pages"
            echo "Native ABIs: arm64-v8a, armeabi-v7a, x86_64"
            echo "Signing scope: temporary CI-only identity; not the persistent Argus release signer"
            echo "Update behavior: cannot update APKs signed with a different certificate or a different CI run's temporary certificate"
          } > "$dist_dir/BUILD-MANIFEST.txt"
          cat "$dist_dir/BUILD-MANIFEST.txt"

      - name: Upload installable CI APK
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: argus-installable-ci-apk
          path: |
            dist/ARGUS-CI.apk
            dist/ARGUS-CI.apk.sha256
            dist/ARGUS-CI.apk.certificate-sha256
            dist/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Check protected release signing secrets
        if: ${{ github.ref == 'refs/tags/Release' }}
        shell: bash
        env:
          ARGUS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARGUS_RELEASE_KEYSTORE_BASE64 }}
          ARGUS_RELEASE_STORE_PASSWORD: ${{ secrets.ARGUS_RELEASE_STORE_PASSWORD }}
          ARGUS_RELEASE_KEY_PASSWORD: ${{ secrets.ARGUS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ARGUS_RELEASE_KEYSTORE_BASE64 \
            ARGUS_RELEASE_STORE_PASSWORD \
            ARGUS_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Production Release is blocked. Missing protected environment secrets: ${missing[*]}."
            exit 1
          fi
          echo "All protected production signing secrets are present."

      - name: Sign and cryptographically verify release APK
        if: ${{ github.ref == 'refs/tags/Release' }}
        shell: bash
        env:
          ARGUS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARGUS_RELEASE_KEYSTORE_BASE64 }}
          ARGUS_RELEASE_STORE_PASSWORD: ${{ secrets.ARGUS_RELEASE_STORE_PASSWORD }}
          ARGUS_RELEASE_KEY_PASSWORD: ${{ secrets.ARGUS_RELEASE_KEY_PASSWORD }}
          ARGUS_RELEASE_KEY_ALIAS: argus-release-2026
        run: |
          set -euo pipefail
          mkdir -p dist
          bash tools/security/sign-release.sh \
            "app/build/outputs/apk/release/app-release-unsigned.apk" \
            "dist/ARGUS.apk"

      - name: Write verified build manifest
        if: ${{ github.ref == 'refs/tags/Release' }}
        shell: bash
        run: |
          set -euo pipefail
          apk="dist/ARGUS.apk"
          metadata="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -m1 '^package:')"
          {
            echo "Application: com.argus.agi"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Source branch: ${GITHUB_REF_NAME}"
            echo "Signing certificate SHA-256: $(cat "${apk}.certificate-sha256")"
            echo "APK SHA-256: $(awk '{print $1}' "${apk}.sha256")"
            echo "Package metadata: ${metadata}"
            echo "Native ABI packaging: arm64-v8a, armeabi-v7a, x86_64"
            echo "Signature: apksigner verified; v3 scheme valid for minSdk 34"
            echo "ZIP alignment: verified for 16 KiB native-library pages"
          } > "dist/BUILD-MANIFEST.txt"
          cat "dist/BUILD-MANIFEST.txt"

      - name: Upload installable Argus APK
        if: ${{ github.ref == 'refs/tags/Release' }}
        uses: actions/upload-artifact@v7
        with:
          name: argus-production-release
          path: |
            dist/ARGUS.apk
            dist/ARGUS.apk.sha256
            dist/ARGUS.apk.certificate-sha256
            dist/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-release:
    if: ${{ github.ref == 'refs/tags/Release' }}
    name: Publish verified APK to GitHub Release
    needs: build-sign
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download production APK and verification manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name argus-production-release \
            --dir dist
          for asset in \
            dist/ARGUS.apk \
            dist/ARGUS.apk.sha256 \
            dist/ARGUS.apk.certificate-sha256 \
            dist/BUILD-MANIFEST.txt; do
            test -s "$asset"
          done

      - name: Create or update the GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(
            dist/ARGUS.apk
            dist/ARGUS.apk.sha256
            dist/ARGUS.apk.certificate-sha256
            dist/BUILD-MANIFEST.txt
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --title "Argus $tag" \
              --notes "Production-signed Android APK built from the verified main commit. See BUILD-MANIFEST.txt for source commit, package, certificate fingerprint, and APK checksum." \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "Published verified production APK assets for $tag."
