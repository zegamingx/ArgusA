name: Argus Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-signed-release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.ref == 'refs/heads/main'
    name: Verify, sign and publish Argus APK
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment:
      name: release-signing
    permissions:
      contents: write

    steps:
      - name: Checkout main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          test -s "${sdk_root}/platforms/android-37.0/android.jar"
          test -x "${sdk_root}/platform-tools/adb"
          echo "Android SDK API 37.0 is ready."

      - name: Install Android NDK r30 and CMake 4.5.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_path}" ]]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "${sdkmanager_path}"
          set +o pipefail
          yes | "${sdkmanager_path}" --licenses >/dev/null
          set -o pipefail
          "${sdkmanager_path}" --install "build-tools;37.0.0" "ndk;30.0.16248370"
          test -x "${ANDROID_HOME}/build-tools/37.0.0/apksigner"

          cmake_version="4.5.0"
          cmake_archive="cmake-${cmake_version}-linux-x86_64.tar.gz"
          cmake_archive_path="${RUNNER_TEMP}/${cmake_archive}"
          cmake_root="${RUNNER_TEMP}/cmake-${cmake_version}"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/${cmake_archive}" \
            --output "${cmake_archive_path}"
          printf '%s  %s\n' "81f0d5b0960fb6adc8197030ffc827fba937640d51e73e39e0e9e40d88c66f6f" "${cmake_archive_path}" | sha256sum --check --status
          mkdir -p "${cmake_root}"
          tar -xzf "${cmake_archive_path}" --strip-components=1 -C "${cmake_root}"
          tools/cmake-compat/install-wrapper.sh "${cmake_root}/bin/cmake" "${RUNNER_TEMP}/argus-cmake-compat"
          "${RUNNER_TEMP}/argus-cmake-compat/bin/cmake" --version | grep -Fx "cmake version ${cmake_version}"

          glslc_path="$(find "${ANDROID_HOME}/ndk/30.0.16248370/shader-tools" -type f -name glslc -print -quit)"
          test -n "${glslc_path}"
          test -x "${glslc_path}"

      - name: Resolve application version
        shell: bash
        run: |
          set -euo pipefail
          major="$(awk -F= '$1 == "VERSION_MAJOR" { print $2 }' version.properties)"
          minor="$(awk -F= '$1 == "VERSION_MINOR" { print $2 }' version.properties)"
          patch="$(awk -F= '$1 == "VERSION_PATCH" { print $2 }' version.properties)"
          build="$(awk -F= '$1 == "VERSION_BUILD" { print $2 }' version.properties)"
          if [[ ! "${build}" =~ ^[0-9]+$ || "${build}" -le 0 ]]; then
            echo "::error::Invalid VERSION_BUILD in version.properties."
            exit 1
          fi
          echo "VERSION_NAME=${major}.${minor}.${patch}" >> "${GITHUB_ENV}"
          echo "VERSION_BUILD=${build}" >> "${GITHUB_ENV}"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Build, sign and verify with protected signing secrets
        env:
          ARGUS_SIGNING_KEY_BASE64: ${{ secrets.ARGUS_SIGNING_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ARGUS_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ARGUS_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          : "${ARGUS_SIGNING_KEY_BASE64:?Missing environment secret ARGUS_SIGNING_KEY_BASE64.}"
          : "${STORE_PASSWORD:?Missing environment secret ARGUS_SIGNING_STORE_PASSWORD.}"
          : "${KEY_PASSWORD:?Missing environment secret ARGUS_SIGNING_KEY_PASSWORD.}"

          umask 077
          keystore_path="${RUNNER_TEMP}/argus-release.p12"
          trap 'rm -f -- "${keystore_path}"' EXIT
          printf '%s' "${ARGUS_SIGNING_KEY_BASE64}" | base64 --decode > "${keystore_path}"
          unset ARGUS_SIGNING_KEY_BASE64
          test -s "${keystore_path}"
          chmod 600 "${keystore_path}"

          keytool -list -storetype PKCS12 \
            -keystore "${keystore_path}" \
            -storepass "${STORE_PASSWORD}" \
            -alias upload >/dev/null

          expected_fingerprint="950f815c01b819c07a9cdbc21bd150936d8623871c28c211a974e8263ab34cf6"
          actual_fingerprint="$(
            keytool -exportcert -storetype PKCS12 \
              -keystore "${keystore_path}" \
              -storepass "${STORE_PASSWORD}" \
              -alias upload |
              sha256sum | awk '{print tolower($1)}'
          )"
          if [[ "${actual_fingerprint}" != "${expected_fingerprint}" ]]; then
            echo "::error::Signing certificate mismatch. Expected the current v1.0.13 signer; refusing to publish."
            exit 1
          fi

          chmod +x gradlew
          env -u ANDROID_SDK_ROOT \
            KEYSTORE_PATH="${keystore_path}" \
            KEY_ALIAS=upload \
            STORE_PASSWORD="${STORE_PASSWORD}" \
            KEY_PASSWORD="${KEY_PASSWORD}" \
            ./gradlew --no-daemon --no-configuration-cache --stacktrace \
              clean :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease

          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "${apk_path}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "${apk_path}" | grep -Fx "lib/${abi}/libargus_training.so"
          done

          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" \
            verify --verbose --print-certs "${apk_path}" > "${RUNNER_TEMP}/apksigner-report.txt"
          apk_fingerprint="$(
            awk '
              tolower($0) ~ /certificate sha-256 digest:/ {
                line = $0
                sub(/^.*digest:[[:space:]]*/, "", line)
                gsub(/[^[:xdigit:]]/, "", line)
                print tolower(line)
                exit
              }
            ' "${RUNNER_TEMP}/apksigner-report.txt"
          )"
          if [[ "${apk_fingerprint}" != "${expected_fingerprint}" ]]; then
            echo "::error::Built APK signer does not match the approved certificate."
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/argus-dist"
          release_apk="ARGUS-v${VERSION_NAME}.apk"
          cp "${apk_path}" "${RUNNER_TEMP}/argus-dist/${release_apk}"
          cp "${apk_path}" "${RUNNER_TEMP}/argus-dist/ARGUS.apk"
          (cd "${RUNNER_TEMP}/argus-dist" && sha256sum "${release_apk}" > "${release_apk}.sha256")
          (cd "${RUNNER_TEMP}/argus-dist" && sha256sum ARGUS.apk > ARGUS.apk.sha256)

      - name: Publish verified APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_apk="ARGUS-v${VERSION_NAME}.apk"
          cd "${RUNNER_TEMP}/argus-dist"

          release_notes="$(printf "Latest manually approved Argus release.\nVersion: v%s\nBuild: %s\nSource commit: %s\nSigner SHA-256: %s\n" "${VERSION_NAME}" "${VERSION_BUILD}" "${SOURCE_SHA}" "950f815c01b819c07a9cdbc21bd150936d8623871c28c211a974e8263ab34cf6")"
          if gh release view Release >/dev/null 2>&1; then
            gh release edit Release --title "Argus Latest Release" --notes "${release_notes}"
            gh release upload Release "${release_apk}" "${release_apk}.sha256" ARGUS.apk ARGUS.apk.sha256 --clobber
          else
            gh release create Release "${release_apk}" "${release_apk}.sha256" ARGUS.apk ARGUS.apk.sha256 \
              --target "${SOURCE_SHA}" \
              --title "Argus Latest Release" \
              --notes "${release_notes}"
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/Release" \
            --raw-field "sha=${SOURCE_SHA}" --field "force=true" >/dev/null

          stale_assets="$(gh release view Release --json assets --jq '.assets[].name' |
            grep -E '^ARGUS-v[0-9]+\.[0-9]+\.[0-9]+\.apk(\.sha256)?$' || true)"
          while IFS= read -r stale_asset; do
            [[ -z "${stale_asset}" || "${stale_asset}" == "${release_apk}" || "${stale_asset}" == "${release_apk}.sha256" ]] && continue
            gh release delete-asset Release "${stale_asset}" --yes
            echo "Removed superseded APK asset: ${stale_asset}"
          done <<< "${stale_assets}"

          echo "Published verified Argus APK assets to the rolling Release tag."
