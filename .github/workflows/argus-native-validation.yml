name: Argus Native Validation

on:
  workflow_dispatch:

  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "version.properties"
      - "tools/cmake-compat/**"
      - "tools/native-tests/**"
      - "tools/ci/**"
      - ".github/workflows/argus-native-validation.yml"
      - ".github/workflows/argus-main-release.yml"

permissions:
  contents: read

concurrency:
  group: argus-native-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile Vulkan NDK, lint, test and package debug APK
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-process-recovery'))) && 90 || 60 }}

    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/platform-tools" >> "${GITHUB_PATH}"
          test -s "${sdk_root}/platforms/android-37.0/android.jar"
          sdk_platform="${sdk_root}/platforms/android-37.0"
          if [[ ! -s "${sdk_platform}/android.jar" ]]; then
            echo "::error::Android SDK platform android-37.0 is not installed."
            exit 1
          fi

      - name: Install Android NDK r30 and CMake 4.5.0
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_path}" ]]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "${sdkmanager_path}"

          set +o pipefail
          yes | "${sdkmanager_path}" --licenses >/dev/null
          set -o pipefail
          "${sdkmanager_path}" --install "build-tools;37.0.0" "ndk;30.0.16248370"
          test -x "${ANDROID_HOME}/build-tools/37.0.0/apksigner"

          cmake_version="4.5.0"
          cmake_archive="cmake-${cmake_version}-linux-x86_64.tar.gz"
          cmake_archive_path="${RUNNER_TEMP}/${cmake_archive}"
          cmake_root="${RUNNER_TEMP}/cmake-${cmake_version}"
          # Fetch the official Kitware release asset; the pinned SHA-256 below remains mandatory.
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/${cmake_archive}" \
            --output "${cmake_archive_path}"
          printf '%s  %s\n' "81f0d5b0960fb6adc8197030ffc827fba937640d51e73e39e0e9e40d88c66f6f" "${cmake_archive_path}" | sha256sum --check --status
          mkdir -p "${cmake_root}"
          tar -xzf "${cmake_archive_path}" --strip-components=1 -C "${cmake_root}"
          tools/cmake-compat/install-wrapper.sh "${cmake_root}/bin/cmake" "${RUNNER_TEMP}/argus-cmake-compat"
          "${RUNNER_TEMP}/argus-cmake-compat/bin/cmake" --version | grep -Fx "cmake version ${cmake_version}"

          glslc_path="$(find "${ANDROID_HOME}/ndk/30.0.16248370/shader-tools" -type f -name glslc -print -quit)"
          test -n "${glslc_path}"
          test -x "${glslc_path}"
          echo "NDK r30, CMake ${cmake_version}, and NDK glslc are ready."
# Host-side regression coverage for allocator handles and bounded Vulkan buffer transfers.
      - name: Run Tensor Arena host unit tests
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -O2 \
            tools/native-tests/tensor_arena_core_test.cpp \
            -o "${RUNNER_TEMP}/argus-tensor-arena-core-test"
          "${RUNNER_TEMP}/argus-tensor-arena-core-test"

      - name: Verify Gradle and Java toolchain
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Run native build, lint and unit tests
        run: |
          chmod +x gradlew
          env -u ANDROID_SDK_ROOT ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --warning-mode=all \
            --stacktrace \
            clean \
            :app:lintRelease \
            :app:testReleaseUnitTest \
            :app:assembleDebug

      - name: Verify packaged native ABI libraries
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${apk_path}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "${apk_path}" | grep -Fx "lib/${abi}/libargus_training.so"
          done

      - name: Install Android emulator and API 35 test image
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-process-recovery')) }}
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          sdk_root="$ANDROID_HOME"
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          avdmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name avdmanager -print -quit)"
          test -n "$sdkmanager_path"
          test -n "$avdmanager_path"

          # Keep AVD creation and emulator startup on one explicit, persisted path.
          # Without this, avdmanager may create under ANDROID_SDK_HOME/avd while
          # emulator resolves HOME/.android/avd and reports "Unknown AVD name".
          avd_home="$HOME/.android/avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          export ANDROID_USER_HOME="$HOME/.android"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"

          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" --install "emulator" "system-images;android-35;google_apis;x86_64"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          echo "$(dirname "$avdmanager_path")" >> "$GITHUB_PATH"

          printf 'no\n' | "$avdmanager_path" create avd \
            --name argus-process-recovery \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2 \
            --force

          echo "Created Android Virtual Device definitions:"
          "$avdmanager_path" list avd
          test -s "$ANDROID_AVD_HOME/argus-process-recovery.ini"
          test -d "$ANDROID_AVD_HOME/argus-process-recovery.avd"
          echo "Verified AVD metadata: $ANDROID_AVD_HOME/argus-process-recovery.ini"

      - name: Start Android emulator
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-process-recovery')) }}
        shell: bash
        run: |
          set -euo pipefail
          avd_home="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          export ANDROID_AVD_HOME="$avd_home"
          export ANDROID_USER_HOME="${ANDROID_USER_HOME:-$HOME/.android}"
          avd_ini="$ANDROID_AVD_HOME/argus-process-recovery.ini"
          if [[ ! -s "$avd_ini" || ! -d "$ANDROID_AVD_HOME/argus-process-recovery.avd" ]]; then
            echo "::error::The process-recovery AVD was not created in the configured AVD home: $ANDROID_AVD_HOME"
            find "$HOME/.android" -maxdepth 3 -type f -name 'argus-process-recovery.ini' -print || true
            exit 1
          fi
          echo "Using verified AVD: $avd_ini"

          accel_mode=auto
          device_timeout=180
          boot_timeout=240
          if emulator -accel-check; then
            echo "KVM acceleration is available; using automatic VM acceleration."
          else
            echo "::warning::KVM acceleration is unavailable. Trying the supported software CPU-emulation fallback; this can be significantly slower."
            export ANDROID_I_WANT_MY_TCG=yes
            accel_mode=off
            device_timeout=600
            boot_timeout=900
          fi
          emulator \
            -avd argus-process-recovery \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu software \
            -accel "$accel_mode" \
            > "$RUNNER_TEMP/argus-emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/argus-emulator.pid"
          if ! timeout "${device_timeout}s" adb wait-for-device; then
            echo "::error::Android emulator did not expose an ADB device within ${device_timeout} seconds."
            cat "$RUNNER_TEMP/argus-emulator.log" || true
            exit 1
          fi
          if ! timeout "${boot_timeout}s" bash -c '
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do
              sleep 2
            done
          '; then
            echo "::error::Android emulator did not finish booting within ${boot_timeout} seconds."
            cat "$RUNNER_TEMP/argus-emulator.log" || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run Android process-death recovery matrix
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-process-recovery')) }}
        run: |
          env -u ANDROID_SDK_ROOT ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            :app:connectedDebugAndroidTest

